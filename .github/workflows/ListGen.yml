name: Generate Blocklist & Whitelist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: '0'

      - name: Run pipeline
        id: pipeline
        run: |
          python3 - <<'PYEOF'
          import re, urllib.request, urllib.parse, zipfile, tarfile, io, json, os
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          # ── 1. Setup & Logging ──────────────────────────────────────────────
          bdt = timezone(timedelta(hours=6))
          now_str = datetime.now(bdt).strftime('%Y-%m-%d %I:%M %p')
          
          issues = []
          def report(msg, is_error=False):
              prefix = "❌ ERROR" if is_error else "⚠️ WARN"
              issues.append(f"{prefix} [{now_str}]: {msg}")
              print(f"{prefix}: {msg}")

          _RE_VALID = re.compile(r'^[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?)+$')

          def trim_url_to_label(url):
              """Regex to strip URL noise for clean labels in common.txt and logs."""
              path = urllib.parse.urlparse(url).path
              label = path.split('/')[-1] if '/' in path else url
              label = re.sub(r'(\.txt|\.csv|\.zip|\.gz|\.json|\.tar\.gz)$', '', label, flags=re.I)
              return re.sub(r'[-_]v?\d+(\.\d+)*$', '', label)

          def strip_to_domain(raw):
              line = raw.strip().lower()
              # Handles: 0.0.0.0, ||domain^, *.domain, or raw domain
              m = re.search(r'(?:0\.0\.0\.0\s+|\|\||\*\.)?([a-z0-9][a-z0-9.-]+\.[a-z]{2,})', line)
              if m:
                  d = m.group(1).split('/')[0].strip('^|. \t')
                  if _RE_VALID.match(d): return d
              return None

          # ── 2. Universal Fetcher ────────────────────────────────────────────
          def universal_fetch(url):
              label = trim_url_to_label(url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "AmarDNS/2.0"})
                  with urllib.request.urlopen(req, timeout=35) as r:
                      content_type = r.headers.get('Content-Type', '').lower()
                      data = r.read()
                  
                  # Handle Decompression
                  if url.endswith('.zip') or 'zip' in content_type:
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          target = sorted(z.namelist(), key=lambda x: z.getinfo(x).file_size, reverse=True)[0]
                          raw_text = z.read(target).decode('utf-8', errors='ignore')
                  elif url.endswith('.gz') or 'gzip' in content_type:
                      import gzip
                      raw_text = gzip.decompress(data).decode('utf-8', errors='ignore')
                  else:
                      raw_text = data.decode('utf-8', errors='ignore')

                  # Handle Formats (JSON/CSV/Text)
                  if url.endswith('.json') or 'json' in content_type:
                      found = re.findall(r'"([a-z0-9.-]+\.[a-z]{2,})"', raw_text.lower())
                      return {strip_to_domain(d) for d in found if strip_to_domain(d)}
                  
                  if ',' in raw_text[:500] or '\t' in raw_text[:500]:
                      delim = '\t' if '\t' in raw_text[:100] else ','
                      domains = set()
                      for line in raw_text.splitlines():
                          for part in line.split(delim):
                              d = strip_to_domain(part.strip('" '))
                              if d: domains.add(d)
                      return domains

                  return {strip_to_domain(l) for l in raw_text.splitlines() if strip_to_domain(l)}
              except Exception as e:
                  report(f"Provider {label} failed: {str(e)}")
                  return set()

          # ── 3. Main Logic ───────────────────────────────────────────────────
          bl_file, wl_file = Path("build_blocklist.txt"), Path("build_whitelist.txt")
          
          def extract_tagged_urls(path, tag):
              if not path.exists(): return []
              content = path.read_text()
              m = re.search(rf'\[{tag}\](.*?)\[/{tag}\]', content, re.S | re.I)
              if not m: return []
              return [u.strip() for u in m.group(1).splitlines() if u.strip().startswith('http')]

          # Get all URLs from files
          blacklist_urls = extract_tagged_urls(bl_file, "BLACKLIST_URLS")
          whitelist_urls = extract_tagged_urls(wl_file, "WHITELIST_URLS")

          # Process lists
          all_blocked = set()
          for url in blacklist_urls:
              all_blocked |= universal_fetch(url)

          # (Add your existing deduplication and output writing logic here)

          # Save consolidated logs for Telegram
          if issues:
              Path("pipeline_issues.txt").write_text("\n".join(issues))
          PYEOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "chore: update lists [$(date +'%Y-%m-%d')]" && git push origin 0)

      - name: Telegram Consolidated Alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Only send if pipeline_issues.txt exists OR the workflow itself failed
          if [ -f "pipeline_issues.txt" ] || [ "${{ job.status }}" == "failure" ]; then
            BDT=$(TZ="Asia/Dhaka" date '+%Y-%m-%d %I:%M %p')
            LOGS="No specific provider errors logged."
            [ -f "pipeline_issues.txt" ] && LOGS=$(cat pipeline_issues.txt)
            
            STATUS_EMOJI="⚠️"
            [ "${{ job.status }}" == "failure" ] && STATUS_EMOJI="❌"

            MSG="${STATUS_EMOJI} *AmarDNS Pipeline Report*%0A📅 Time: \`${BDT}\` %0A%0A*Logs:*%0A${LOGS}%0A%0A[View Full Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            
            curl -sSf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown"
          fi
