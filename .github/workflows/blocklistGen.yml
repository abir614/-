name: Generate Blocklist

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 03:00 UTC
  workflow_dispatch:       # Manual trigger anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: '0'

      # ── 2. Download source blocklists ──────────────────────────────────────
      - name: Download TIF mini
        run: |
          curl -sSf --retry 3 --retry-delay 5 \
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.mini.txt" \
            -o tif_mini_raw.txt
          echo "TIF mini lines: $(wc -l < tif_mini_raw.txt)"

      - name: Download Ultimate mini
        run: |
          curl -sSf --retry 3 --retry-delay 5 \
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/ultimate.mini.txt" \
            -o ultimate_mini_raw.txt
          echo "Ultimate mini lines: $(wc -l < ultimate_mini_raw.txt)"

      # ── 3. Download false-positive reference lists ─────────────────────────
      - name: Download Tranco Top 1M
        run: |
          curl -sSf --retry 3 --retry-delay 5 \
            "https://tranco-list.eu/top-1m.csv.zip" -o tranco.zip
          unzip -p tranco.zip | cut -d',' -f2 > tranco.txt
          echo "Tranco domains: $(wc -l < tranco.txt)"

      - name: Download Umbrella Top 1M
        run: |
          curl -sSf --retry 3 --retry-delay 5 \
            "https://s3-us-west-1.amazonaws.com/umbrella-static/top-1m.csv.zip" -o umbrella.zip
          unzip -p umbrella.zip | cut -d',' -f2 > umbrella.txt
          echo "Umbrella domains: $(wc -l < umbrella.txt)"

      - name: Download Majestic Million
        run: |
          curl -sSf --retry 3 --retry-delay 5 \
            "https://downloads.majestic.com/majestic_million.csv" \
            | tail -n +2 | cut -d',' -f3 > majestic.txt
          echo "Majestic domains: $(wc -l < majestic.txt)"

      # ── 4. Process & generate blocklist ───────────────────────────────────
      - name: Generate blocklist
        run: |
          python3 - <<'PYEOF'
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          # ════════════════════════════════════════════════════════════════════
          # PATTERN STRIPPING
          # Handles every known whitelist/blocklist format and extracts a clean
          # root domain (last 2 labels, e.g. evil.com) from any line.
          # ════════════════════════════════════════════════════════════════════

          # Valid domain character set (after stripping)
          _RE_VALID = re.compile(r'^[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?)+$')

          # Patterns applied in ORDER — first match that yields a domain wins
          _STRIP_PATTERNS = [
              # 1. Full-line comments / metadata / blank
              (re.compile(r'^\s*[#!;]'),                          None),   # skip
              (re.compile(r'^\s*$'),                               None),   # skip

              # 2. Hosts file:  0.0.0.0 domain  or  127.0.0.1 domain
              (re.compile(r'^\s*(?:0\.0\.0\.0|127\.0\.0\.1|::1|::)\s+(\S+)'),  1),

              # 3. AdGuard allowlist:  @@||domain^  @@||domain^$important
              (re.compile(r'^\s*@@\|\|([^\/\^\|\s\$]+)[\^\|\$]'),            1),

              # 4. AdGuard/uBlock blocklist:  ||domain^  ||domain^$option
              (re.compile(r'^\s*\|\|([^\/\^\|\s\$]+)[\^\|\$]'),              1),

              # 5. AdGuard simple pipe:  |domain|
              (re.compile(r'^\s*\|([^|]+)\|'),                               1),

              # 6. uBlock/ABP element hide (skip — not a domain rule):  ##...
              (re.compile(r'^\s*##'),                              None),   # skip

              # 7. uBlock/ABP exception:  @@domain or @domain
              (re.compile(r'^\s*@+([^@\s\^\|\/]+)'),                         1),

              # 8. Dnsmasq:  address=/domain/  server=/domain/
              (re.compile(r'^\s*(?:address|server)=\/([^\/]+)\/'),            1),

              # 9. RPZ / BIND zone entry:  domain CNAME .   or  domain A 0.0.0.0
              (re.compile(r'^\s*([a-z0-9][a-z0-9.\-]+)\s+(?:IN\s+)?(?:CNAME|A|AAAA)\s+'), 1),

              # 10. Wildcard:  *.domain.tld
              (re.compile(r'^\s*\*\.([^\s\/\^\|]+)'),                         1),

              # 11. CSV with rank:  123,domain  or  123,domain,category,...
              (re.compile(r'^\s*\d+,([^,\s]+)'),                              1),

              # 12. Plain domain or domain with inline comment:  domain.tld  [# ...]
              (re.compile(r'^\s*([a-z0-9][a-z0-9.\-]+[a-z0-9])\s*(?:#.*)?$'), 1),
          ]

          def strip_to_domain(raw_line: str) -> str | None:
              """
              Apply pattern stripping to extract a clean domain from any line.
              Returns None if the line should be skipped or yields no valid domain.
              """
              line = raw_line.strip().lower()

              for pattern, group in _STRIP_PATTERNS:
                  m = pattern.match(line)
                  if m:
                      if group is None:
                          return None          # explicitly skip this line type
                      candidate = m.group(group)
                      break
              else:
                  # No pattern matched — try treating whole line as plain domain
                  candidate = line

              # ── Clean the candidate ────────────────────────────────────────
              # Strip protocol prefix if accidentally present
              candidate = re.sub(r'^https?://', '', candidate)
              # Strip port
              candidate = re.sub(r':\d+$', '', candidate)
              # Strip path
              candidate = candidate.split('/')[0]
              # Strip trailing punctuation (^, |, ., whitespace)
              candidate = candidate.strip('^|. \t')
              # Lowercase and remove any remaining wildcards
              candidate = candidate.lstrip('*').lstrip('.')
              # Final cleanup
              candidate = candidate.strip()

              if not candidate or '.' not in candidate:
                  return None

              # Validate character set
              if not _RE_VALID.match(candidate):
                  return None

              return candidate

          def extract_root(domain: str) -> str | None:
              """Collapse any domain to its root (last 2 labels): sub.evil.com → evil.com"""
              parts = domain.rstrip('.').split('.')
              if len(parts) < 2:
                  return None
              return '.'.join(parts[-2:])

          def parse_any_list(text: str, label: str) -> set[str]:
              """
              Parse any whitelist/blocklist format into a set of root domains.
              Applies full pattern stripping on every line.
              """
              roots = set()
              skipped = 0
              for raw in text.splitlines():
                  domain = strip_to_domain(raw)
                  if domain is None:
                      skipped += 1
                      continue
                  root = extract_root(domain)
                  if root:
                      roots.add(root)
                  else:
                      skipped += 1
              print(f"  {label}: {len(roots):,} root domains ({skipped:,} lines skipped)")
              return roots

          # ════════════════════════════════════════════════════════════════════
          # LOAD BLOCKLISTS (Hagezi wildcard format)
          # ════════════════════════════════════════════════════════════════════
          print("\n[1/5] Loading source blocklists...")
          tif      = parse_any_list(Path("tif_mini_raw.txt").read_text(errors="ignore"),    "TIF mini")
          ultimate = parse_any_list(Path("ultimate_mini_raw.txt").read_text(errors="ignore"), "Ultimate mini")

          intersection = tif & ultimate
          print(f"\n  TIF mini:      {len(tif):>8,}")
          print(f"  Ultimate mini: {len(ultimate):>8,}")
          print(f"  Intersection:  {len(intersection):>8,}  ← domains in BOTH lists")

          # ════════════════════════════════════════════════════════════════════
          # LOAD REFERENCE LISTS (Tranco / Umbrella / Majestic)
          # ════════════════════════════════════════════════════════════════════
          print("\n[2/5] Loading false-positive reference lists...")
          tranco   = parse_any_list(Path("tranco.txt").read_text(errors="ignore"),   "Tranco")
          umbrella = parse_any_list(Path("umbrella.txt").read_text(errors="ignore"), "Umbrella")
          majestic = parse_any_list(Path("majestic.txt").read_text(errors="ignore"), "Majestic")

          # ════════════════════════════════════════════════════════════════════
          # PARSE whitelist.txt — static entries + external URLs
          # ════════════════════════════════════════════════════════════════════
          print("\n[3/5] Loading whitelist (static + external URLs)...")

          wl_text = Path("whitelist.txt").read_text(errors="ignore") if Path("whitelist.txt").exists() else ""

          # ── Extract external URLs from [WHITELIST_URLS] block ──────────────
          url_block_match = re.search(
              r'\[WHITELIST_URLS\](.*?)\[\/WHITELIST_URLS\]',
              wl_text, re.DOTALL | re.IGNORECASE
          )
          external_urls = []
          if url_block_match:
              for line in url_block_match.group(1).splitlines():
                  line = line.strip()
                  # Skip blank lines and comments
                  if not line or line.startswith('#'):
                      continue
                  if line.startswith('http://') or line.startswith('https://'):
                      external_urls.append(line)

          print(f"  Found {len(external_urls)} external whitelist URL(s)")

          # ── Fetch each external whitelist ──────────────────────────────────
          external_domains: set[str] = set()
          for url in external_urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "AmarDNS-Blocklist-Builder/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      content = resp.read().decode("utf-8", errors="ignore")
                  fetched = parse_any_list(content, f"  → {url}")
                  external_domains |= fetched
              except urllib.error.URLError as e:
                  print(f"  ⚠  WARN: Failed to fetch {url} — {e} (skipping)")
              except Exception as e:
                  print(f"  ⚠  WARN: Error processing {url} — {e} (skipping)")

          # ── Parse static entries (everything outside the URL block) ────────
          # Remove the [WHITELIST_URLS]...[/WHITELIST_URLS] block first
          static_text = re.sub(
              r'\[WHITELIST_URLS\].*?\[\/WHITELIST_URLS\]',
              '', wl_text, flags=re.DOTALL | re.IGNORECASE
          )
          static_domains = parse_any_list(static_text, "Static whitelist")

          custom = static_domains | external_domains
          print(f"\n  Static entries:   {len(static_domains):>7,}")
          print(f"  External entries: {len(external_domains):>7,}")
          print(f"  Combined custom:  {len(custom):>7,}")

          # ════════════════════════════════════════════════════════════════════
          # FALSE-POSITIVE FILTERING
          # ════════════════════════════════════════════════════════════════════
          print("\n[4/5] Filtering false positives...")
          safe    = tranco | umbrella | majestic | custom
          fp_hits = intersection & safe
          clean   = intersection - safe

          print(f"  Safe set total:  {len(safe):>8,} unique root domains")

          if fp_hits:
              print(f"\n  ⚠  Removed {len(fp_hits)} likely false positives:")
              for d in sorted(fp_hits):
                  sources = []
                  if d in tranco:   sources.append("Tranco")
                  if d in umbrella: sources.append("Umbrella")
                  if d in majestic: sources.append("Majestic")
                  if d in custom:   sources.append("Custom/External")
                  print(f"    - {d:<40}  [{', '.join(sources)}]")
          else:
              print("  ✓ No false positives detected")

          print(f"\n  Final clean domains: {len(clean):,}")

          # ════════════════════════════════════════════════════════════════════
          # WRITE OUTPUT
          # ════════════════════════════════════════════════════════════════════
          print("\n[5/5] Writing blocklist...")

          now = datetime.now(timezone.utc)
          header_lines = [
              "# ============================================================",
              "# Amar DNS — Combined Wildcard Blocklist",
              "# ============================================================",
              f"# Generated : {now.strftime('%Y-%m-%d %H:%M UTC')}",
              "# Sources   : HaGeZi TIF mini + Ultimate mini (intersection)",
              "# FP-check  : Tranco Top 1M, Umbrella Top 1M, Majestic Million,",
              "#             Static whitelist, External whitelists",
              "# Syntax    : Wildcard (*.root.tld) — one entry per line",
              f"# Entries   : {len(clean):,}",
              "# ============================================================",
              "# Stats",
              f"#   TIF mini raw          : {len(tif):,}",
              f"#   Ultimate mini raw      : {len(ultimate):,}",
              f"#   Intersection           : {len(intersection):,}",
              f"#   Tranco safe            : {len(tranco):,}",
              f"#   Umbrella safe          : {len(umbrella):,}",
              f"#   Majestic safe          : {len(majestic):,}",
              f"#   Static whitelist       : {len(static_domains):,}",
              f"#   External whitelist     : {len(external_domains):,}  ({len(external_urls)} URL(s))",
              f"#   False positives rm     : {len(fp_hits):,}",
              f"#   Final entries          : {len(clean):,}",
              "# ============================================================",
          ]

          out = Path("blocklist.txt")
          with out.open("w", encoding="utf-8") as f:
              f.write("\n".join(header_lines) + "\n")
              for domain in sorted(clean):
                  f.write(f"*.{domain}\n")

          print(f"  ✓ Written to blocklist.txt ({out.stat().st_size / 1024:.1f} KB)")
          PYEOF

      # ── 5. Print summary ───────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "=== blocklist.txt header ==="
          head -25 blocklist.txt
          echo ""
          echo "=== Final entry count ==="
          grep -c '^\*\.' blocklist.txt || true

      # ── 6. Commit & push if changed ────────────────────────────────────────
      - name: Commit blocklist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt
          if git diff --cached --quiet; then
            echo "No changes to blocklist — skipping commit"
          else
            ENTRIES=$(grep -c '^\*\.' blocklist.txt || true)
            git commit -m "chore: update blocklist — ${ENTRIES} entries [$(date -u '+%Y-%m-%d')]"
            git push origin 0
          fi
